<!-- @dsCard group="Iconography" viewport="900x360" name="Sync Loader states" subtitle="Six state icons extracted from the Sync Loader spec" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body{margin:0;background:var(--color-bg-base,#0A0A0B);color:var(--color-text-secondary,#B7B7BC);font-family:Inter,system-ui,sans-serif;padding:32px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 12px;border:1px solid var(--color-divider,#26262B);border-radius:16px;background:var(--color-surface-2,#141418)}
  .cell img{width:56px;height:56px}
  .label{font-size:13px;font-weight:600;color:var(--color-text-primary,#F5F5F7)}
  .file{font-size:11px;font-family:ui-monospace,monospace;color:var(--color-text-tertiary,#6B6B70)}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><img src="sync-connecting.svg" alt="Connecting"><div class="label">Connecting</div><div class="file">sync-connecting.svg</div></div>
    <div class="cell"><img src="sync-syncing.svg" alt="Syncing"><div class="label">Syncing</div><div class="file">sync-syncing.svg</div></div>
    <div class="cell"><img src="sync-loading.svg" alt="Loading"><div class="label">Loading</div><div class="file">sync-loading.svg</div></div>
    <div class="cell"><img src="sync-success.svg" alt="Success"><div class="label">Success</div><div class="file">sync-success.svg</div></div>
    <div class="cell"><img src="sync-error.svg" alt="Error"><div class="label">Error</div><div class="file">sync-error.svg</div></div>
    <div class="cell"><img src="sync-reduced-motion.svg" alt="Reduced motion"><div class="label">Reduced motion</div><div class="file">sync-reduced-motion.svg</div></div>
  </div>
</body></html>
