# Owner one-time setup: add three repository secrets under Settings > Secrets and variables > Actions: SUPABASE_ACCESS_TOKEN (personal access token from supabase.com/dashboard/account/tokens), SUPABASE_PROJECT_ID (the project ref), SUPABASE_DB_PASSWORD (database password). Optionally add a repository VARIABLE (same page, Variables tab) SITE_URL = your production URL (e.g. https://rideinsync.app); it defaults to http://localhost:5173 when unset. After that, merging any PR that adds supabase/migrations/*.sql applies the migrations AND configures the Supabase auth redirect URLs automatically (localhost + SITE_URL), so the owner never edits the dashboard. Re-runs are safe: `supabase db push` only applies migrations not yet recorded in the project's schema_migrations history, and the auth-URL step is idempotent (it merges into the existing allow list). Seeding demo data is NOT automatic: run it manually via Actions > this workflow > Run workflow, with the apply_seed box ticked.
name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      apply_seed:
        description: 'Also run supabase/seed.sql against the hosted project (demo data). Never on by default.'
        type: boolean
        default: false

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All three required secrets are present."

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Configure auth redirect URLs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'http://localhost:5173' }}
        run: |
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/config/auth"

          # Read the current auth config.
          get=$(curl -sS -w '\n%{http_code}' -X GET "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          get_code=$(printf '%s' "$get" | tail -n1)
          get_body=$(printf '%s' "$get" | sed '$d')
          if [ "$get_code" -lt 200 ] || [ "$get_code" -ge 300 ]; then
            echo "::error::GET auth config failed (HTTP $get_code): $get_body"
            exit 1
          fi

          # Merge existing uri_allow_list (comma-separated) with the required
          # entries, trimmed and de-duplicated. Idempotent on re-run.
          payload=$(printf '%s' "$get_body" | jq -c \
            --arg site "$SITE_URL" \
            '{
               site_url: $site,
               uri_allow_list: (
                 ((.uri_allow_list // "") | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0)))
                 + ["http://localhost:5173", "http://localhost:5173/**", $site, ($site + "/**")]
                 | unique | join(",")
               )
             }')

          # Apply it.
          resp=$(curl -sS -w '\n%{http_code}' -X PATCH "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::PATCH auth config failed (HTTP $code): $body"
            exit 1
          fi
          echo "Auth redirect URLs configured (site_url=$SITE_URL; localhost + SITE_URL merged into uri_allow_list)."

      - name: Seed hosted project (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_seed
        run: |
          pw=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          conn="postgresql://postgres:${pw}@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/postgres?sslmode=require"
          psql "$conn" -v ON_ERROR_STOP=1 -f supabase/seed.sql
